spring.application.name=clientes-api

# Datasource configuration using environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clientesdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=${APP_PORT:8080}
server.error.include-message=always

# Actuator for Healthchecks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
